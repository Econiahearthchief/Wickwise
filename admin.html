!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WickWise — Admin</title>
<style>
  :root {
    --wax-dark: #1C140D; --wax-panel: #2A1D12; --wax-cream: #F2E6D3;
    --wax-cream-dim: rgba(242, 230, 211, 0.65); --flame: #E8A33D;
    --ember: #C1592B; --line: rgba(242, 230, 211, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--wax-dark); color: var(--wax-cream);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh; padding-bottom: 60px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px; border-bottom: 1px solid var(--line);
  }
  .brand { font-family: Georgia, serif; font-size: 1.2rem; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 20px; }

  #login-screen { text-align: center; padding-top: 80px; }
  #login-screen input {
    width: 100%; background: var(--wax-panel); border: 1px solid var(--line);
    color: var(--wax-cream); padding: 12px 14px; border-radius: 8px;
    margin-bottom: 12px; font-size: 1rem;
  }
  button.primary {
    width: 100%; background: var(--flame); color: var(--wax-dark);
    border: none; padding: 14px; border-radius: 8px; font-weight: 600;
    cursor: pointer; font-size: 0.95rem;
  }
  button.primary:hover { background: #f0b459; }

  #app-screen { display: none; }

  h2.section-title {
    font-family: Georgia, serif; font-weight: 400; font-size: 1.2rem;
    margin: 28px 0 14px;
  }

  .sub-card {
    background: var(--wax-panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px; margin-bottom: 12px;
  }
  .sub-card .sub-name { font-weight: 600; margin-bottom: 4px; }
  .sub-card .sub-note { font-size: 0.85rem; color: var(--wax-cream-dim); margin-bottom: 10px; }
  .sub-card img { width: 100%; border-radius: 6px; margin-bottom: 10px; }
  .sub-actions { display: flex; gap: 8px; }
  .sub-actions button {
    flex: 1; padding: 10px; border-radius: 6px; border: none;
    font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  .approve-btn { background: #4a7a4a; color: white; }
  .reject-btn { background: var(--ember); color: white; }

  .empty-note {
    color: var(--wax-cream-dim); font-size: 0.85rem;
    text-align: center; padding: 20px; border: 1px dashed var(--line); border-radius: 8px;
  }

  .seller-form input {
    width: 100%; background: var(--wax-panel); border: 1px solid var(--line);
    color: var(--wax-cream); padding: 12px 14px; border-radius: 8px;
    margin-bottom: 10px; font-size: 0.95rem;
  }
  #seller-add-status, #auth-error { font-size: 0.85rem; margin-top: 8px; color: var(--wax-cream-dim); }
</style>
</head>
<body>

<header>
  <div class="brand">WickWise Admin</div>
  <button class="primary" id="logout-btn" style="display:none; width:auto; padding:8px 14px; font-size:0.8rem;">Sign out</button>
</header>

<main>
  <div id="login-screen">
    <p style="margin-bottom:20px; color: var(--wax-cream-dim);">Admin sign-in required.</p>
    <input type="email" id="login-email" placeholder="Email">
    <input type="password" id="login-password" placeholder="Password">
    <button class="primary" id="login-btn">Sign in</button>
    <p id="auth-error"></p>
  </div>

  <div id="app-screen">
    <h2 class="section-title">Pending gallery submissions</h2>
    <div id="pending-list"><div class="empty-note">Loading…</div></div>

    <h2 class="section-title">Pending verified sellers</h2>
    <div id="pending-sellers-list"><div class="empty-note">Loading…</div></div>

    <h2 class="section-title">Add a verified seller</h2>
    <div class="seller-form">
      <input type="text" id="seller-name" placeholder="Seller / shop name">
      <input type="text" id="seller-url" placeholder="Shop URL (https://...)">
      <button class="primary" id="add-seller-btn">Add to directory</button>
      <p id="seller-add-status"></p>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, query, where, getDocs, doc, updateDoc, addDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD3KgWXsbDmwYCyMLIXeOCkxa8tfrNZSQQ",
    authDomain: "wickwise-app.firebaseapp.com",
    projectId: "wickwise-app",
    storageBucket: "wickwise-app.firebasestorage.app",
    messagingSenderId: "309673736602",
    appId: "1:309673736602:web:f3063cd08687dfd5dee223",
    measurementId: "G-3EH20R34K7"
  };

  const ADMIN_EMAIL = 'chief.econia@gmail.com';

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, (user) => {
    const isAdmin = user && user.email === ADMIN_EMAIL;
    document.getElementById('login-screen').style.display = isAdmin ? 'none' : 'block';
    document.getElementById('app-screen').style.display = isAdmin ? 'block' : 'none';
    document.getElementById('logout-btn').style.display = isAdmin ? 'inline-block' : 'none';
    if (isAdmin) { loadPending(); loadPendingSellers(); }
  });

  document.getElementById('login-btn').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('auth-error');
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      errEl.textContent = err.message.replace('Firebase: ', '');
    }
  });

  document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

  async function loadPending() {
    const listEl = document.getElementById('pending-list');
    listEl.innerHTML = '<div class="empty-note">Loading…</div>';
    const q = query(collection(db, 'gallery_submissions'), where('status', '==', 'pending'));
    const snap = await getDocs(q);
    if (snap.empty) {
      listEl.innerHTML = '<div class="empty-note">No pending submissions.</div>';
      return;
    }
    listEl.innerHTML = '';
    snap.forEach(docSnap => {
      const d = docSnap.data();
      const card = document.createElement('div');
      card.className = 'sub-card';
      card.innerHTML = `
        ${d.photoUrl ? `<img src="${d.photoUrl}" alt="${d.name}">` : ''}
        <div class="sub-name">${d.name}</div>
        <div class="sub-note">${d.note}</div>
        <div class="sub-actions">
          <button class="approve-btn" data-id="${docSnap.id}" data-action="approved">Approve</button>
          <button class="reject-btn" data-id="${docSnap.id}" data-action="rejected">Reject</button>
        </div>
      `;
      listEl.appendChild(card);
    });

    listEl.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await updateDoc(doc(db, 'gallery_submissions', btn.dataset.id), { status: btn.dataset.action });
        loadPending();
      });
    });
  }

  async function loadPendingSellers() {
    const listEl = document.getElementById('pending-sellers-list');
    listEl.innerHTML = '<div class="empty-note">Loading…</div>';
    const q = query(collection(db, 'verified_sellers'), where('status', '==', 'pending'));
    const snap = await getDocs(q);
    if (snap.empty) {
      listEl.innerHTML = '<div class="empty-note">No pending sellers.</div>';
      return;
    }
    listEl.innerHTML = '';
    snap.forEach(docSnap => {
      const d = docSnap.data();
      const card = document.createElement('div');
      card.className = 'sub-card';
      card.innerHTML = `
        <div class="sub-name">${d.name}</div>
        <div class="sub-note"><a href="${d.shopUrl}" target="_blank" rel="noopener" style="color: var(--flame);">${d.shopUrl}</a></div>
        <div class="sub-actions">
          <button class="approve-btn" data-id="${docSnap.id}" data-action="active">Approve</button>
          <button class="reject-btn" data-id="${docSnap.id}" data-action="rejected">Reject</button>
        </div>
      `;
      listEl.appendChild(card);
    });

    listEl.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await updateDoc(doc(db, 'verified_sellers', btn.dataset.id), { status: btn.dataset.action });
        loadPendingSellers();
      });
    });
  }

  document.getElementById('add-seller-btn').addEventListener('click', async () => {
    const name = document.getElementById('seller-name').value.trim();
    const shopUrl = document.getElementById('seller-url').value.trim();
    const statusEl = document.getElementById('seller-add-status');
    if (!name || !shopUrl) {
      statusEl.textContent = 'Name and URL are both required.';
      return;
    }
    try {
      await addDoc(collection(db, 'verified_sellers'), { name, shopUrl, status: 'active', createdAt: serverTimestamp() });
      statusEl.textContent = `✓ ${name} added to the directory.`;
      document.getElementById('seller-name').value = '';
      document.getElementById('seller-url').value = '';
    } catch (err) {
      statusEl.textContent = 'Could not add — try again.';
    }
  });
</script>

</body>
</html>
