[build]
  functions = "netlify/functions"
  publish = "."

[build.environment]
  # The Firebase apiKey hardcoded in the HTML files is a public,
  # client-side identifier (not a secret) — Firebase security comes from
  # the Firestore/Storage rules, not from hiding this key. Netlify's
  # automatic secret scanner doesn't know that, so skip these files.
  SECRETS_SCAN_OMIT_PATHS = "index.html,gallery.html,admin.html,guide-beginners.html,guide-best-wax.html,guide-fragrance-oil.html"

[functions]
  node_bundler = "esbuild"

# Canonical domain: everything collapses to https://www.wickwise.shop/ in ONE hop.
# (Placed first — Netlify evaluates redirects top-down, first match wins.)
[[redirects]]
  from = "http://wickwise.shop/*"
  to = "https://www.wickwise.shop/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.wickwise.shop/*"
  to = "https://www.wickwise.shop/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://wickwise.shop/*"
  to = "https://www.wickwise.shop/:splat"
  status = 301
  force = true

# Stripe webhooks need the raw request body — do not let Netlify's default
# body parsing/redirect rules touch this path.
[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
